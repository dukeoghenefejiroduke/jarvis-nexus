# This file is a template, and might need editing before it works on your project.
# This is a sample GitLab CI/CD configuration file that should run without any modifications.
# It demonstrates a basic 3 stage CI/CD pipeline. Instead of real tests or scripts,
# it uses echo commands to simulate the pipeline execution.
#
# A pipeline is composed of independent jobs that run scripts, grouped into stages.
# Stages run in sequential order, but jobs within stages run in parallel.
#
# For more information, see: https://docs.gitlab.com/ee/ci/yaml/#stages
#
# You can copy and paste this template `.gitlab-ci.yml` file.
# You should not add this template to an existing `.gitlab-ci.yml` file by using the `include:` keyword.
#
# To contribute improvements to CI/CD templates, please follow the Development guide at:
# https://docs.gitlab.com/development/cicd/templates/
# This specific template is located at:
# https://gitlab.com/gitlab-org/gitlab/-/blob/master/lib/gitlab/ci/templates/Getting-Started.gitlab-ci.yml


stages:
  - verify
  - secure
  - package

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

verify:
  stage: verify
  image: python:3.12-slim
  script:
    - python --version
    - python -m unittest discover -s tests -v
  artifacts:
    when: always
    paths:
      - test-results.txt
    expire_in: 1 week
  after_script:
    - python -m unittest discover -s tests -v > test-results.txt 2>&1 || true

security:
  stage: secure
  image: python:3.12-slim
  script:
    - echo "Running repository security checks..."
    - |
      if grep -RInE \
        --exclude-dir=.git \
        --exclude='*.pyc' \
        --exclude='*.db' \
        --exclude='.env.example' \
        -E '(^|[^A-Za-z])(sk-[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{20,}|glpat-[A-Za-z0-9_-]{20,})' .; then
        echo "Potential credential detected."
        exit 1
      fi
    - echo "Security checks passed."

package:
  stage: package
  image: python:3.12-slim
  script:
    - python -m compileall -q jarvis_nexus
    - mkdir -p dist
    - tar --exclude='.git' --exclude='data/*.db' --exclude='__pycache__' -czf dist/jarvis-nexus-transcend.tar.gz .
  artifacts:
    paths:
      - dist/jarvis-nexus-transcend.tar.gz
    expire_in: 1 week