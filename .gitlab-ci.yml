include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/SAST.gitlab-ci.yml

stages:
  - verify
  - test
  - secure
  - package

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

verify:
  stage: verify
  image: python:3.12-slim
  script:
    - python --version
    - python -m unittest discover -s tests -v 2>&1 | tee test-results.txt
  artifacts:
    when: always
    paths:
      - test-results.txt
    expire_in: 1 week

security:
  stage: secure
  image: python:3.12-slim
  script:
    - echo "Running repository security checks..."
    - |
      if grep -RInE \
        --exclude-dir=.git \
        --exclude='*.pyc' \
        --exclude='*.db' \
        --exclude='.env.example' \
        --exclude='*.log' \
        --exclude='*.pem' \
        --exclude='*.key' \
        -E '(^|[^A-Za-z])(sk-[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{20,}|glpat-[A-Za-z0-9_-]{20,})' .; then
        echo "Potential credential detected."
        exit 1
      fi
    - echo "Custom credential checks passed."

package:
  stage: package
  image: python:3.12-slim
  script:
    - python -m compileall -q jarvis_nexus
    - mkdir -p dist
        - tar --exclude='.git' --exclude='data/*.db' --exclude='__pycache__' --exclude='*.pyc' --exclude='*.log' --exclude='*.pem' --exclude='*.key' --exclude='.env' --exclude='.env.*' --exclude='dist' -czf dist/jarvis-nexus-transcend.tar.gz .
  artifacts:
    paths:
      - dist/jarvis-nexus-transcend.tar.gz
    expire_in: 1 week